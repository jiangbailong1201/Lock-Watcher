name: Build
on: push

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create placeholder Secrets.swift
        run: |
          mkdir -p Source/Application
          echo 'enum Secrets {' > Source/Application/Secrets.swift
          echo '    static let soul = ""' >> Source/Application/Secrets.swift
          echo '    static let keychainId = ""' >> Source/Application/Secrets.swift
          echo '    static let appKey = ""' >> Source/Application/Secrets.swift
          echo '    static let userDefaultsId = ""' >> Source/Application/Secrets.swift
          echo '    static let dropboxKey = ""' >> Source/Application/Secrets.swift
          echo '}' >> Source/Application/Secrets.swift
          ls -la Source/Application

      - name: Build Xcode project
        run: |
          xcodebuild -project Lock-Watcher.xcodeproj \
            -scheme Lock-Watcher-non-mas \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
